<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#fafaf9" />
  <!-- Outer hairline ring -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#e7e5e4" stroke-width="1.5" />
  <!-- Inner brand ring -->
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="#1c1917" stroke-width="1.2" />
  <!-- Accent brass halo -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#967538" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.6" />
  <!-- VEYRA 'V' serif monogram -->
  <text 
    x="32" 
    y="39.5" 
    font-family="'Cinzel', 'Cormorant Garamond', 'Times New Roman', serif" 
    font-size="24" 
    font-style="italic" 
    font-weight="500" 
    text-anchor="middle" 
    fill="#1c1917"
    letter-spacing="-0.5"
  >V</text>
</svg>
